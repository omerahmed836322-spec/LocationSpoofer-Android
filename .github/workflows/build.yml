name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradlew" ]; then
          echo "⚙️ Generating Gradle Wrapper automatically..."
          mkdir -p gradle/wrapper
          # تحميل سكريبت gradlew الرسمي من مستودع Gradle
          curl -sL https://raw.githubusercontent.com/gradle/gradle/master/gradlew -o gradlew
          chmod +x gradlew
          # إنشاء ملف الإعدادات الخاص بـ Gradle
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          echo "✅ Gradle Wrapper generated successfully!"
        else
          chmod +x gradlew
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LocationSpoofer-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
